<div class="content-title">文件浏览器</div>
<div class="article">
    
</br>
    <h3>1、了解文件浏览器</h3>
    <p>点击“<img src="images/ic_folder.png" alt=" " style="width: auto; height: auto; vertical-align: middle; margin: 0 5px;">”弹出如图所示文件浏览。它可浏览系统中保存的文档、白板板书、视频、图片、音频等文件，<br>同时，它可自动识别外接USB设备、分类浏览文件、搜索文件等</p>
    <br>
    <img src="images/pic_folder.png" alt=" " style="max-width: 100%; height: auto;">

    <br>
    <h3>2、资源操作</h3>
    <p>点击“<img src="images/ic_selector.png" alt=" " style="width: auto; height: auto; vertical-align: middle; margin: 0 5px;">”弹出如图所示文件编辑；可选择文件并进行复制、粘贴、剪切、删除及重命名</p>
    <br>
    <img src="images/pic_select_tool.png" alt=" " style="max-width: 100%; height: auto;">

    <br>
    <h3>3、排序菜单</h3>
    <p>点击底部工具栏中“<img src="images/ic_sort.png" alt=" " style="width: auto; height: auto; vertical-align: middle; margin: 0 5px;">”弹出如图所示菜单，可将资源进行排序</p>
    <br>
    <img src="images/pic_sort_tool.png" alt=" " style="max-width: 100%; height: auto;">





</div>
