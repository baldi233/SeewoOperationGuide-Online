<div class="content-title">清洁设备</div>
<div class="article">
    
</br>
    <h3>1、清洁屏幕</h3>
    <p>1.1、准备清洁物品：不起毛的棉质、绒毛抹布、玻璃清洁剂</p>
    <br>
    <img src="images/pic_clean_tool_1.png" alt=" " style="max-width: 100%; height: auto;">
    
    
    <br>
    <br>

    <p>1.2、关闭设备，断开外接电源</p>
    <br>
    
    
    <p>1.3、将玻璃清洁剂按照合适比例稀释，然后均匀的喷洒到屏幕表面（比较难清洁的地方根据实际情况适当增加剂量）</p>
    <br>
    <img src="images/pic_clean_tool_2.png" alt=" " style="max-width: 100%; height: auto;">
    <br>
    
    <br>
    <p>1.4、用干抹布按照一定顺序（如由右到左），从上到下擦拭</p>
    <br>
    <img src="images/pic_clean_tool_3.png" alt=" " style="max-width: 100%; height: auto;">
    <br>

    <br>
    <p>1.5、到底后再擦拭右边位置，同样从上到下，直到整个屏幕表面清洁完成</p>
    <br>
    <img src="images/pic_clean_tool_4.png" alt=" " style="max-width: 100%; height: auto;">
    <br>
    <br>
    <p>注意事项：保持屏幕干净，避免外力冲撞屏幕。不能有任何液体流到底部触摸框</p>
    <br>
    
    <h3>2、清洁边框</h3>
    <p>直接用棉质或绒毛抹布擦掉边框和底边杂物、粉尘。保持干净</p>
    <br>
    <img src="images/pic_clean_tool_5.png" alt=" " style="max-width: 100%; height: auto;">
    <br>
    <br>
    <p>注意事项：保持边框、底边干净，避免滴撒任何液体</p>

</div>
