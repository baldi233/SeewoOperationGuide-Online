    <h3>1、为什么智能交互平板电源指示灯红亮，指示灯无法转蓝灯？</h3>
    <p>尊敬的用户，您好，请确认：</p>
    <p>1.1、电源线插座电压和接地正常</p>
    <p>1.2、如果电源没有问题，需确保 TV 板卡端的 USB 多媒体端口无外接设备</p>
    <p>1.3、请使用按键和遥控尝试</p>

    <h3>2、为什么智能交互平板无法开机？</h3>
    <p>尊敬的用户，您好，请确认：</p>
    <p>2.1、电源线插座电压和接地正常</p>
    <p>2.2、确保机器的船型开关是打开在“I”的位置</p>
    <p>2.3、检查按键正常以及遥控器电池电量充足</p>

    <h3>3、为什么智能交互平板某个或多个按键不起作用？</h3>
    <p>尊敬的用户，您好，请排查按键是否因为用力过猛无法弹起或者按键有灰尘挤压导致不起作用</p>
