    <h3>1、外接PC，无触摸，提示“无法识别的USB设备”</h3>
    <p>尊敬的用户，您好，请确认：<br>1.1、请换其他的USB接口连接<br>1.2、请更换USB触摸线<br>1.3、请重新安装系统</p>
    </h3>
    
    <br>
    <h3>2、为什么智能交互平板外置电脑触摸定位不准？</h3>
    <p>尊敬的用户，您好，请确认：<br>2.1、无外界干扰（光照，其他设备的红外信号）<br>2.2、擦拭触摸框周边的灰尘<br>2.3、尝试打开TouchService软件进行触摸框重置操作</p>
    </h3>
