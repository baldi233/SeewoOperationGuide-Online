<div class="content-title">正确关机</div>
<div class="article">
    
</br>
    <h3>1、正确的关机方法</h3>
    <p>方法一：长按关机键“<img src="images/ic_shutdown.png" alt=" " style="width: auto; height: auto; vertical-align: middle; margin: 0 5px;">”，进行关机</p>
</br>
    <img src="images/pic_boot_shutdown.png" alt=" " style="max-width: 100%; height: auto;">
    
    <p>方法二：进入PC通道下，点击“<img src="images/ic_desktop.png" alt=" " style="width: auto; height: auto; vertical-align: middle; margin: 0 5px;">”，再点击“<img src="images/ic_power.png" alt=" " style="width: auto; height: auto; vertical-align: middle; margin: 0 5px;">”即可选择关闭或重启智能平板</p>
</br>
    <img src="images/ic_win.png" alt=" " style="max-width: 100%; height: auto;">

<br>
<br>
<br>
    <h3>2、错误关机说明</h3>
    <p>错误的关机方式，会造成硬盘的损坏，文件的丢失！</p>
    
    <p>错误关机方式一：直接关闭整机船型开关</p>
    </br>
    <img src="images/pic_shutdown_error1.png" alt=" " style="max-width: 100%; height: auto;">
    
    <br>
    <p>错误关机方式二：直接切断所在房间全部供电，例如切断教室电闸、直接切断教学楼电闸</p>
    </br>
    <img src="images/pic_shutdown_error2.png" alt=" " style="max-width: 100%; height: auto;">
    
</br>
</br>
</br>
</br>
</br>
    <p>错误关机方式三：整机长时间黑屏待机</p>
    </br>
    <img src="images/pic_shutdown_error3.png" alt=" " style="max-width: 100%; height: auto;">
