    <h3>1、中控面板</h3>
    <p>呼出中控页面板，以显示屏的下边缘中心位置为起点，用手指向屏幕中心位置滑动即可调出触摸菜单</p>
</br>
    <img src="images/pic_controllor.png" alt=" " style="max-width: 100%; height: auto;">

    <h3>2、切换通道</h3>
    <p>点击相应的通道图标，即可完成相应的通道切换！</p>
    <p>通道外圈是蓝色“<img src="images/ic_circle.png" alt=" " style="width: auto; height: auto; vertical-align: middle; margin: 0 5px;">”表示设备处于当前通道，通道下的信号灯为蓝色“<img src="images/ic_point.png" alt=" " style="width: auto; height: auto; vertical-align: middle; margin: 0 5px;">”表示此通道已接入设备</p>
</br>
