    <h4>外接电脑步骤说明</h4>
    </br>
    <p>1、用VGA线连接外接电脑的VGA输出端口，同时用音频线连接外接电脑的音频输出接口<br>2、用USB线连接外接电脑的USB接口<br>3、连接完成后，插上电源线，并将电源线开关切至开<br>4、启动外接电脑<br>5、按“<img src="images/ic_power.png" alt=" " style="width: auto; height: auto; vertical-align: middle; margin: 0 5px;">”键，设备开机<br>6、按INPUT键切换到VGA通道</p>
