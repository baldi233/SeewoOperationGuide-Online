    <h3>1、Windows系统还原方法</h3>
    <p>从屏幕中间底部往上拉，调出中控菜单，切换至安卓通道</p>
    <br>
    <img src="images/pic_controllor_android.png" alt=" " style="max-width: 100%; height: auto;">
    <br>

    <h3>2、单击“设置”</h3>
    <br>
    <img src="images/setting.png" alt=" " style="max-width: 100%; height: auto;">
    <br>


    <h3>3、选择“关于”，在“触摸信息”处连续单击六次</h3>
    <br>
    <img src="images/pic_setting_about.png" alt=" " style="max-width: 100%; height: auto;">
    <br>

    <h3>4、在弹出的窗口中单击“确定”</h3>
    <br>
    <img src="images/pic_setting_re.png" alt=" " style="max-width: 100%; height: auto;">
