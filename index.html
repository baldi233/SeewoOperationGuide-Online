<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>希沃 操作指南 在线版</title>
    <link rel="icon" type="image/png" href="images/ic_launcher.png">
    <!-- 引入首页专属 CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="home-container">
        <!-- 左侧内容区 -->
        <div class="home-left">
            <img src="images/ic_launcher.png" alt=" " style="width: auto; height: auto; vertical-align: middle; margin: 0 5px;"class="top-logo-img">
            <br>
            <h1 class="home-title">希沃 操作指南 在线版</h1>
            
            <div class="home-desc">
                <p>源自希沃 Android 系统下的 操作指南 应用内的内容<br>内容无任何修改，仅为搬运供在线查看</p>
            </div>

            <!-- 选择框 -->
            <select id="guideSelect" class="home-select">
                <option value="0">（点击此处选择一个版本进行阅读）</option>
                <option value="1.0">1.0</option>
                <option value="1.1">1.1</option>
            </select>

            <!-- 动态变化的文字 -->
            <p id="dynamicText" class="home-dynamic-text">
                （选择一个版本进行阅读）
            </p>

            <!-- 跳转按钮 -->
            <button id="startBtn" class="home-start-btn">开始阅读</button>
            

            <br>
              <!-- GitHub 图标跳转链接 -->
            <a href="https://github.com/baldi233/SeewoOperationGuide-Online/" target="_blank" rel="noopener noreferrer" class="github-link" title="前往 GitHub 查看项目">
                <!-- 直接使用内联 SVG，不需要额外下载图片，颜色会自动跟随 CSS -->
                <svg class="github-icon" viewBox="0 0 16 16" width="32" height="32" fill="currentColor">
                    <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.012 8.012 0 0 0 16 8c0-4.42-3.58-8-8-8z"/>
                </svg>
            </a>


        </div>

        <!-- 右侧图片区 -->
        <div class="home-right">
            <!-- 默认显示一张图，JS会动态替换src -->
            <img id="displayImage" src="images/banner1.png" alt="暂时还没有图片（（" class="home-image">
        </div>
    </div>

    <script src="js/main.js"></script>
</body>
</html>
